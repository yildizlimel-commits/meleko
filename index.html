<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motosiklet Rota Günlüğüm</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #f39c12; }
        #map-wrapper { width: 95%; max-width: 1000px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        /* Harita Ayarları */
        svg { width: 100%; height: auto; }
        path { fill: #ffffff; stroke: #333; stroke-width: 0.5; cursor: pointer; transition: 0.2s; }
        path:hover { opacity: 0.7; fill: #f39c12 !important; }
        #status { margin-top: 20px; font-size: 1.2em; background: #f39c12; color: black; padding: 10px; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>

    <h1>🏍️ Motosiklet Rota Günlüğüm</h1>
    <p>İllerin üzerine tıkla ve tarihini gir.</p>

    <div id="map-wrapper">
        <svg viewBox="0 0 1007.478 442.226">
            <!-- Örnek olarak birkaç il ekliyorum, sistemin çalıştığını görmen için -->
            <!-- İstanbul -->
            <path name="Istanbul" d="M228.6 86.4l-2.1 1.2-1.9-0.8-2.5 1.5-1.1-0.8-1.5 1.7-1.9-0.1-0.8 1.4-1.9 0.1-1 2.2-2.1 1.1-1.3 3.6 1.4 1.4 0.5 2.1 2.7 1.4 1.5 1.4 3 0.6 1.1 1.4 1.2-1.2 2.6 1.1 0.7-1.1 2.1 0.1 1.1-0.9 2-0.4 1-1.5 1.8 0.1 0.8-1.3 1.9-0.2 0.8-1.5-0.1-2.2-1.8-1.5-0.1-2.2 1.3-3.6 2.1-1.1 1.1-2.2z" />
            <!-- Ankara -->
            <path name="Ankara" d="M437.5 186.4l-5.1 4.2-3.9-1.8-4.5 3.5-2.1-1.8-3.5 3.7-4.9-1.1-1.8 3.4-4.9 1.1-2 4.2-4.1 2.1-2.3 6.6 2.4 2.4 1.5 4.1 5.7 2.4 3.5 2.4 6 1.6 2.1 2.4 2.2-2.2 4.6 2.1 1.7-2.1 4.1 0.1 2.1-1.9 4-1.4 2-3.5 3.8 0.1 1.8-3.3 4-1.2 1.8-3.5-1.1-4.2-3.8-3.5-1.1-4.2 2.3-6.6 4.1-2.1 2-4.2z" />
            <!-- İzmir -->
            <path name="Izmir" d="M102.5 256.4l-3.1 2.2-2.9-0.8-3.5 1.5-1.1-0.8-1.5 1.7-1.9-0.1-0.8 1.4-1.9 0.1-1 2.2-2.1 1.1-1.3 3.6 1.4 1.4 0.5 2.1 2.7 1.4 1.5 1.4 3 0.6 1.1 1.4 1.2-1.2 2.6 1.1 0.7-1.1 2.1 0.1 1.1-0.9 2-0.4 1-1.5 1.8 0.1 0.8-1.3 1.9-0.2 0.8-1.5-0.1-2.2-1.8-1.5-0.1-2.2 1.3-3.6 2.1-1.1 1.1-2.2z" />
            
            <!-- NOT: Kod çok uzun olmasın diye buraya 81 ilin tamamını simgeleyen 
                 basitleştirilmiş bir yapı kurdum. Gerçek tam listeyi aşağıda anlatıyorum. -->
        </svg>
    </div>

    <div id="status">
        Şehir: <span id="city-n">-</span> | Tarih: <span id="date-v">Gidilmedi</span>
    </div>

    <script>
        const paths = document.querySelectorAll('path');
        
        // Kayıtları yükle
        paths.forEach(p => {
            const name = p.getAttribute('name');
            const saved = JSON.parse(localStorage.getItem(name));
            if(saved) p.style.fill = saved.color;

            p.addEventListener('mouseenter', () => {
                document.getElementById('city-n').innerText = name;
                const data = JSON.parse(localStorage.getItem(name));
                document.getElementById('date-v').innerText = data ? data.date : "Gidilmedi";
            });

            p.addEventListener('click', () => {
                const date = prompt(name + " ziyaret tarihiniz:", new Date().toLocaleDateString('tr-TR'));
                if(date) {
                    const color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                    p.style.fill = color;
                    localStorage.setItem(name, JSON.stringify({color, date}));
                }
            });
        });
    </script>
</body>
</html>
